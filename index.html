<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suminagashi Shader</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #error { position: fixed; top: 1rem; left: 1rem; color: #f66; font: 14px monospace; white-space: pre; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="error"></div>
  <script>
    // Minimal Shadertoy-compatible runner: loads shader.glsl and provides iResolution and iTime.
    const canvas = document.getElementById("canvas");
    const errorBox = document.getElementById("error");
    const gl = canvas.getContext("webgl2");

    const vertexSource = `#version 300 es
      in vec2 position;
      void main() { gl_Position = vec4(position, 0.0, 1.0); }
    `;

    const wrap = (body) => `#version 300 es
      precision highp float;
      uniform vec3 iResolution;
      uniform float iTime;
      out vec4 outColor;
      ${body}
      void main() { mainImage(outColor, gl_FragCoord.xy); }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    async function start() {
      if (!gl) throw new Error("WebGL 2 is not available in this browser.");
      const response = await fetch("shader.glsl");
      if (!response.ok) throw new Error("Could not load shader.glsl (serve this folder over HTTP).");

      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, wrap(await response.text())));
      gl.linkProgram(program);
      gl.useProgram(program);

      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, "position");
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

      const iResolution = gl.getUniformLocation(program, "iResolution");
      const iTime = gl.getUniformLocation(program, "iTime");
      const t0 = performance.now();

      function frame(now) {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.floor(canvas.clientWidth * dpr);
        const h = Math.floor(canvas.clientHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        gl.viewport(0, 0, w, h);
        gl.uniform3f(iResolution, w, h, 1);
        gl.uniform1f(iTime, (now - t0) / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    start().catch((e) => { errorBox.textContent = e.message; });
  </script>
</body>
</html>
